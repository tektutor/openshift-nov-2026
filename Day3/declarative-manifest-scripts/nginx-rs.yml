apiVersion: apps/v1
kind: ReplicaSet
metadata:
  labels:
    app: nginx
  name: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: image-registry.openshift-image-registry.svc:5000/openshift/bitnami-nginx:1.25
        name: bitnami-nginx
        resources: {}
status: {}
