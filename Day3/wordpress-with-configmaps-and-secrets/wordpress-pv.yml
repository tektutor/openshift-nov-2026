apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-pv-jegan # Replace 'jegan' with your name
  labels:
    name: jegan  # Replace 'jegan' with your name
    app: wordpress
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce  # All the pods from one node in the openshift cluster can read & write this external storage
  persistentVolumeReclaimPolicy: Retain

  nfs:
    server: 192.168.11.201  # In case you are working on second server, you need to change this to 192.168.11.202
    path: /var/nfs/jegan/wordpress  # Replace jegan with your linux user
